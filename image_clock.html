<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 Image Converter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;500;700;900&display=swap');
 
:root {
  --bg:      #080c10;
  --panel:   #0d1520;
  --border:  #1a2d42;
  --accent:  #00d4ff;
  --accent2: #7c4dff;
  --green:   #00e57a;
  --red:     #ff3c5a;
  --warn:    #ffb300;
  --text:    #c8dde8;
  --muted:   #4a6070;
  --mono:    'Share Tech Mono', monospace;
  --sans:    'Exo 2', sans-serif;
}
 
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  padding: 24px 16px;
  overflow-x: hidden;
}
 
/* ─── scanline overlay ──────── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,212,255,.018) 2px, rgba(0,212,255,.018) 4px
  );
  pointer-events: none; z-index: 1000;
}
 
/* ─── header ────────────────── */
header {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 28px;
}
.logo-box {
  width: 48px; height: 48px;
  border: 2px solid var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,212,255,.08);
  box-shadow: 0 0 14px rgba(0,212,255,.3);
  flex-shrink: 0;
}
.logo-box svg { width: 28px; height: 28px; }
.title-block h1 {
  font-family: var(--mono);
  font-size: 1.1em;
  color: var(--accent);
  letter-spacing: .12em;
  text-shadow: 0 0 10px rgba(0,212,255,.5);
}
.title-block p {
  font-size: .72em; color: var(--muted);
  letter-spacing: .06em; margin-top: 2px;
}
 
/* ─── cards ─────────────────── */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: .5;
}
.card h2 {
  font-family: var(--mono);
  font-size: .72em;
  letter-spacing: .18em;
  color: var(--muted);
  margin-bottom: 14px;
}
 
/* ─── settings row ───────────── */
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.field label {
  display: block; font-size: .72em; letter-spacing: .1em;
  color: var(--muted); margin-bottom: 5px;
}
.field input, .field select {
  width: 100%;
  background: #060b10;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: .9em;
  padding: 8px 10px;
  outline: none;
  transition: border-color .2s;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field select option { background: #060b10; }
 
/* ─── path row ───────────────── */
.path-row {
  display: flex; gap: 8px; align-items: stretch;
  margin-bottom: 16px;
}
.path-row .field { flex: 1; margin: 0; }
.path-row .field input { border-radius: 6px 0 0 6px; }
.browse-btn {
  background: rgba(0,212,255,.1);
  border: 1px solid var(--accent);
  border-radius: 0 6px 6px 0;
  color: var(--accent);
  font-family: var(--mono);
  font-size: .75em;
  letter-spacing: .08em;
  padding: 0 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .2s;
}
.browse-btn:hover { background: rgba(0,212,255,.2); }
 
/* ─── drop zone ──────────────── */
#dropzone {
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  position: relative;
}
#dropzone.over {
  border-color: var(--accent);
  background: rgba(0,212,255,.04);
}
#dropzone .dz-icon { font-size: 2.4em; margin-bottom: 8px; }
#dropzone .dz-title {
  font-family: var(--mono); font-size: .85em;
  color: var(--accent); letter-spacing: .1em; margin-bottom: 4px;
}
#dropzone .dz-sub { font-size: .72em; color: var(--muted); }
#dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
 
/* ─── preview grid ───────────── */
#preview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 8px;
  margin-top: 14px;
  min-height: 0;
}
.prev-item {
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  background: var(--border);
  aspect-ratio: 3/4;
  border: 1px solid transparent;
  transition: border-color .2s;
}
.prev-item.done { border-color: var(--green); }
.prev-item.error { border-color: var(--red); }
.prev-item canvas {
  width: 100%; height: 100%; display: block; object-fit: cover;
}
.prev-item .badge {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .6em; font-family: var(--mono);
  background: rgba(0,0,0,.65);
  opacity: 0; transition: opacity .2s;
}
.prev-item:hover .badge { opacity: 1; }
.prev-item .state-dot {
  position: absolute; top: 3px; right: 3px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted);
}
.prev-item.done .state-dot { background: var(--green); }
.prev-item.error .state-dot { background: var(--red); }
.prev-item.processing .state-dot {
  background: var(--warn);
  animation: pulse 0.7s infinite alternate;
}
 
@keyframes pulse { to { opacity: .3; } }
 
/* ─── action row ─────────────── */
.action-row {
  display: flex; gap: 8px; margin-top: 16px;
}
.btn {
  flex: 1; padding: 12px;
  border: none; border-radius: 8px;
  font-family: var(--mono); font-size: .82em; letter-spacing: .1em;
  cursor: pointer; font-weight: 700;
  transition: opacity .2s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-convert {
  background: linear-gradient(135deg, #00d4ff 0%, #0090cc 100%);
  color: #080c10;
}
.btn-clear {
  background: rgba(255,60,90,.12);
  border: 1px solid rgba(255,60,90,.3);
  color: var(--red);
  flex: 0 0 auto; padding: 12px 16px;
}
 
/* ─── progress ───────────────── */
#progress-wrap { margin-top: 14px; display: none; }
#progress-track {
  height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 8px;
}
#progress-fill {
  height: 6px; background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 3px; width: 0; transition: width .25s;
  box-shadow: 0 0 8px rgba(0,212,255,.5);
}
#progress-label {
  font-family: var(--mono); font-size: .72em;
  color: var(--muted); text-align: center;
}
 
/* ─── log ────────────────────── */
#log {
  background: #060b10;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: .72em;
  line-height: 1.7;
  max-height: 160px;
  overflow-y: auto;
  color: var(--muted);
}
#log .ok  { color: var(--green); }
#log .err { color: var(--red); }
#log .inf { color: var(--accent); }
 
/* ─── stats bar ──────────────── */
#stats-bar {
  display: flex; gap: 10px;
  font-family: var(--mono); font-size: .72em;
  color: var(--muted);
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.stat { display: flex; align-items: center; gap: 5px; }
.stat .val { color: var(--accent); }
 
/* ─── scrollbar ──────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
 
<header>
  <div class="logo-box">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="6" width="22" height="16" rx="2" stroke="#00d4ff" stroke-width="1.5"/>
      <rect x="8" y="3" width="4" height="3" rx="1" fill="#7c4dff"/>
      <rect x="16" y="3" width="4" height="3" rx="1" fill="#7c4dff"/>
      <path d="M9 14 L13 10 L17 15 L20 12" stroke="#00e57a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="title-block">
    <h1>ESP32 IMAGE CONVERTER</h1>
    <p>240 × 320 · JPEG · SD CARD READY</p>
  </div>
</header>
 
<!-- Settings -->
<div class="card">
  <h2>// OUTPUT SETTINGS</h2>
  <div class="settings-grid">
    <div class="field">
      <label>WIDTH (px)</label>
      <input type="number" id="cfg-w" value="240" min="1" max="4096">
    </div>
    <div class="field">
      <label>HEIGHT (px)</label>
      <input type="number" id="cfg-h" value="320" min="1" max="4096">
    </div>
    <div class="field">
      <label>MAX FILE SIZE (KB)</label>
      <input type="number" id="cfg-maxkb" value="45" min="1" max="10000" title="Tool finds highest quality that fits under this limit">
    </div>
    <div class="field">
      <label>FILL COLOR (letterbox)</label>
      <input type="color" id="cfg-fill" value="#000000" style="height:38px;padding:2px 6px;cursor:pointer;">
    </div>
  </div>
 
  <div class="path-row">
    <div class="field">
      <label>SAVE FOLDER PATH</label>
      <input type="text" id="cfg-path" placeholder="e.g. C:\Users\you\Desktop\esp32_images or /home/you/esp32">
    </div>
    <button class="browse-btn" onclick="browsePath()" title="Browse folder (browser may not support)">📁 BROWSE</button>
  </div>
 
  <div id="stats-bar">
    <div class="stat">SELECTED <span class="val" id="st-sel">0</span></div>
    <div class="stat">CONVERTED <span class="val" id="st-done">0</span></div>
    <div class="stat">FAILED <span class="val" id="st-err">0</span></div>
    <div class="stat">TOTAL SIZE <span class="val" id="st-size">—</span></div>
  </div>
 
  <!-- Drop zone -->
  <div id="dropzone">
    <div class="dz-icon">🖼️</div>
    <div class="dz-title">DROP IMAGES HERE</div>
    <div class="dz-sub">or click to pick · JPG, PNG, WEBP, BMP, GIF</div>
    <input type="file" id="file-input" accept="image/*" multiple>
  </div>
 
  <div id="preview-grid"></div>
 
  <div class="action-row">
    <button class="btn btn-convert" id="btn-go" disabled onclick="runConvert()">▶ CONVERT &amp; SAVE ALL</button>
    <button class="btn btn-clear" onclick="clearAll()">✕ CLEAR</button>
  </div>
 
  <div id="progress-wrap">
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="progress-label">—</div>
  </div>
</div>
 
<!-- Log -->
<div class="card">
  <h2>// CONVERSION LOG</h2>
  <div id="log"><span class="inf">» ready — add images above</span></div>
</div>
 
<script>
// ─── state ────────────────────────────────────────────────────
let queue = [];           // { file, name, canvas }
let folderHandle = null;  // File System Access API handle (if available)
 
const fileInput  = document.getElementById('file-input');
const dropzone   = document.getElementById('dropzone');
const grid       = document.getElementById('preview-grid');
const btnGo      = document.getElementById('btn-go');
const logEl      = document.getElementById('log');
const progWrap   = document.getElementById('progress-wrap');
const progFill   = document.getElementById('progress-fill');
const progLabel  = document.getElementById('progress-label');
 
// ─── drag & drop ──────────────────────────────────────────────
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('over');
  handleFiles([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
});
fileInput.addEventListener('change', () => {
  handleFiles([...fileInput.files]);
  fileInput.value = '';
});
 
// ─── browse folder (File System Access API) ───────────────────
async function browsePath() {
  if ('showDirectoryPicker' in window) {
    try {
      folderHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      document.getElementById('cfg-path').value = folderHandle.name + '  ✓ (folder selected)';
      logLine('inf', '» folder selected via browser: ' + folderHandle.name);
    } catch (e) {
      if (e.name !== 'AbortError') logLine('err', '✗ folder picker error: ' + e.message);
    }
  } else {
    alert('Your browser doesn\'t support the Folder Picker API.\nType the path manually, or use Chrome/Edge 86+.');
  }
}
 
// ─── add files ────────────────────────────────────────────────
function handleFiles(files) {
  files.forEach(f => {
    const entry = { file: f, name: sanitizeName(f.name), canvas: null, el: null };
    queue.push(entry);
    addThumb(entry);
  });
  updateStats();
  btnGo.disabled = queue.length === 0;
}
 
function sanitizeName(n) {
  return n.replace(/[^a-zA-Z0-9_.\-]/g, '_').replace(/\s+/g, '_');
}
 
function addThumb(entry) {
  const wrap = document.createElement('div');
  wrap.className = 'prev-item';
  const cv = document.createElement('canvas');
  cv.width = 60; cv.height = 80;
  const dot = document.createElement('div');
  dot.className = 'state-dot';
  const badge = document.createElement('div');
  badge.className = 'badge';
  badge.textContent = entry.name;
  wrap.appendChild(cv); wrap.appendChild(dot); wrap.appendChild(badge);
  grid.appendChild(wrap);
  entry.el = wrap;
 
  // draw mini preview via FileReader (consistent with processEntry)
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const ctx = cv.getContext('2d');
      const s = Math.max(60/img.width, 80/img.height);
      const sw = img.width*s, sh = img.height*s;
      ctx.drawImage(img, (60-sw)/2, (80-sh)/2, sw, sh);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(entry.file);
}
 
// ─── clear ────────────────────────────────────────────────────
function clearAll() {
  queue = [];
  grid.innerHTML = '';
  btnGo.disabled = true;
  progWrap.style.display = 'none';
  logEl.innerHTML = '<span class="inf">» cleared</span>';
  updateStats();
}
 
// ─── stats ────────────────────────────────────────────────────
function updateStats(done=0, err=0, bytes=0) {
  document.getElementById('st-sel').textContent  = queue.length;
  document.getElementById('st-done').textContent = done;
  document.getElementById('st-err').textContent  = err;
  document.getElementById('st-size').textContent = bytes > 0 ? fmtBytes(bytes) : '—';
}
 
function fmtBytes(b) {
  if (b < 1024) return b+'B';
  if (b < 1048576) return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(2)+'MB';
}
 
// ─── log ──────────────────────────────────────────────────────
function logLine(cls, msg) {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg;
  logEl.appendChild(document.createTextNode('\n'));
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}
 
// ─── draw image onto a canvas (returns canvas) ────────────────
function drawToCanvas(img, w, h, fillColor) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const s = Math.min(w / img.width, h / img.height);
  const sw = img.width * s, sh = img.height * s;
  ctx.fillStyle = fillColor;
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, Math.round((w - sw) / 2), Math.round((h - sh) / 2), Math.round(sw), Math.round(sh));
  return cv;
}
 
// ─── encode canvas at given quality → blob ────────────────────
function encodeJpeg(cv, quality) {
  return new Promise((resolve, reject) => {
    cv.toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob failed')), 'image/jpeg', quality / 100);
  });
}
 
// ─── load a File → HTMLImageElement via FileReader (data: URL) ───────────────
// Avoids createObjectURL expiry/permission issues with large batches
function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload  = () => resolve(img);
      img.onerror = () => reject(new Error('decode failed: ' + file.name));
      img.src = reader.result;  // data: URL — stable, no revocation issues
    };
    reader.onerror = () => reject(new Error('read failed: ' + file.name));
    reader.readAsDataURL(file);
  });
}
 
// ─── core conversion with binary-search size cap ──────────────
async function processEntry(entry, w, h, maxBytes, fillColor) {
  const img = await loadImageFromFile(entry.file);  // throws on any read/decode error
  const cv  = drawToCanvas(img, w, h, fillColor);
  img.src   = '';  // free memory
 
  // Binary search: find highest quality that stays under maxBytes
  let lo = 1, hi = 100, bestBlob = null, bestQ = 1;
 
  while (lo <= hi) {
    const mid  = Math.floor((lo + hi) / 2);
    const blob = await encodeJpeg(cv, mid);
    if (blob.size <= maxBytes) {
      bestBlob = blob; bestQ = mid;
      lo = mid + 1;   // fits — try higher quality
    } else {
      hi = mid - 1;   // too big — go lower
    }
  }
 
  if (!bestBlob) {
    // Even q=1 is over limit — save anyway with a warning
    bestBlob = await encodeJpeg(cv, 1);
    return { blob: bestBlob, quality: 1, overLimit: true };
  }
  return { blob: bestBlob, quality: bestQ, overLimit: false };
}
 
// ─── save blob ────────────────────────────────────────────────
async function saveBlob(blob, name) {
  // If File System Access API and folder selected
  if (folderHandle) {
    try {
      const outName = name.replace(/\.[^.]+$/, '') + '.jpg';
      const fh = await folderHandle.getFileHandle(outName, { create: true });
      const writable = await fh.createWritable();
      await writable.write(blob);
      await writable.close();
      return { method: 'folder', name: outName };
    } catch(e) {
      // fall through to download
    }
  }
 
  // Fallback: trigger download
  const outName = name.replace(/\.[^.]+$/, '') + '.jpg';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = outName; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return { method: 'download', name: outName };
}
 
async function runConvert() {
  if (queue.length === 0) return;
 
  const w         = parseInt(document.getElementById('cfg-w').value)     || 240;
  const h         = parseInt(document.getElementById('cfg-h').value)     || 320;
  const maxKB     = parseInt(document.getElementById('cfg-maxkb').value) || 45;
  const maxBytes  = maxKB * 1024;
  const fillColor = document.getElementById('cfg-fill').value || '#000000';
  const manualPath = document.getElementById('cfg-path').value.trim();
 
  btnGo.disabled = true;
  progWrap.style.display = 'block';
  logEl.innerHTML = '';
 
  const useFolder = !!folderHandle;
  if (!useFolder && !manualPath) {
    logLine('inf', '» no folder selected — files will be downloaded to your Downloads folder');
    logLine('inf', '» TIP: click 📁 BROWSE to pick an exact folder (Chrome/Edge only)');
  } else if (!useFolder && manualPath) {
    logLine('inf', '» manual path entered: ' + manualPath);
    logLine('inf', '» files will download — move them to the target folder afterward');
    logLine('inf', '» OR: click 📁 BROWSE to enable direct folder save (Chrome/Edge 86+)');
  }
 
  logLine('inf', `» converting ${queue.length} image(s) → ${w}×${h} JPEG  max=${maxKB}KB  fill=${fillColor}`);
  logLine('inf', '» binary-search will find highest quality that fits under limit...');
 
  let done = 0, err = 0, totalBytes = 0;
 
  for (let i = 0; i < queue.length; i++) {
    const entry = queue[i];
    entry.el.classList.add('processing');
 
    progFill.style.width = ((i / queue.length) * 100) + '%';
    progLabel.textContent = `Processing ${i+1} / ${queue.length}: ${entry.name}`;
 
    try {
      const { blob, quality, overLimit } = await processEntry(entry, w, h, maxBytes, fillColor);
      totalBytes += blob.size;
 
      const result = await saveBlob(blob, entry.name);
 
      entry.el.classList.remove('processing');
      entry.el.classList.add('done');
      done++;
 
      const method = result.method === 'folder' ? '→ saved to folder' : '→ downloaded';
      const warn   = overLimit ? '  ⚠ still over limit at q=1' : '';
      logLine(overLimit ? 'err' : 'ok',
        `✓ ${result.name}  [${fmtBytes(blob.size)}  q=${quality}]  ${method}${warn}`);
    } catch(e) {
      entry.el.classList.remove('processing');
      entry.el.classList.add('error');
      err++;
      logLine('err', `✗ ${entry.name}: ${e.message}`);
    }
 
    updateStats(done, err, totalBytes);
    await new Promise(r => setTimeout(r, 20));
  }
 
  progFill.style.width = '100%';
  progLabel.textContent = `Done — ${done} converted, ${err} failed`;
 
  if (done > 0 && !useFolder) {
    logLine('inf', '');
    logLine('inf', '─────────────────────────────────────────');
    logLine('inf', `» ${done} file(s) saved to your Downloads folder`);
    if (manualPath) logLine('inf', `» move them to: ${manualPath}`);
    logLine('inf', '» then copy files to your SD card');
  } else if (done > 0 && useFolder) {
    logLine('ok', `» all ${done} files written directly to: ${folderHandle.name}`);
    logLine('inf', '» copy the folder contents to your ESP32 SD card');
  }
 
  logLine('inf', `» total output size: ${fmtBytes(totalBytes)}`);
  btnGo.disabled = false;
}
</script>
</body>
</html>
